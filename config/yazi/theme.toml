# Yazi picks a flavor from the terminal's background on start only.

#:schema https://yazi-rs.github.io/schemas/theme.json

[flavor]
dark  = "bierstadt-dark"
light = "bierstadt-light"

[tabs]
sep_inner = { open = " ", close = " " }
sep_outer = { open = " ", close = " " }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

[mgr]
marker_symbol = "▏"

[which]
separator = "  "

[confirm]
btn_labels = [ "  Yes  ", "  No  " ]

# No Nerd Font is installed.
[notify]
icon_info  = ""
icon_warn  = ""
icon_error = ""

[cmp]
icon_file    = ""
icon_folder  = ""
icon_command = ""

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
